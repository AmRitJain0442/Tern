name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.7.13'
      - run: uv sync --frozen --extra dev --extra cli --python 3.12
      - run: uv run --no-sync ruff check src tests scripts examples
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync python scripts/check_release.py
      - run: uv build
      - run: uv run --no-sync python scripts/check_release.py --dist dist
      - run: docker compose --env-file /dev/null config --quiet
      - run: docker compose --env-file /dev/null -f compose.yaml -f compose.gpu.yaml config --quiet
