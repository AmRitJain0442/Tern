[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tern-router"
version = "0.1.0"
description = "Local Laya model routing, conservative policies, and a configurable Chat Completions API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "AmRitJain0442 and Tern contributors"}]
maintainers = [{name = "AmRitJain0442"}]
keywords = ["llm", "model-routing", "laya", "mlx", "openrouter", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[project.scripts]
tern = "model_router.cli:main"
model-router = "model_router.cli:main"

[project.urls]
Repository = "https://github.com/AmRitJain0442/tern"
Documentation = "https://github.com/AmRitJain0442/tern/blob/main/docs/quickstart.md"
Issues = "https://github.com/AmRitJain0442/tern/issues"
Changelog = "https://github.com/AmRitJain0442/tern/blob/main/CHANGELOG.md"

[project.optional-dependencies]
adapter = ["google-auth[requests]>=2.38,<3"]
cli = ["google-auth[requests]>=2.38,<3", "rich>=13.9,<16", "python-dotenv>=1,<2"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
mlx-cpu = ["mlx[cpu]==0.32.2; sys_platform == 'linux'", "laya-mlx @ git+https://github.com/mizorewww/laya-mlx.git@0a859518634112655cb97c745dbf04f5191aaf13"]
mlx-cuda = ["mlx[cuda12]==0.32.2; sys_platform == 'linux'", "nvidia-cuda-runtime-cu12==12.9.79; sys_platform == 'linux'", "laya-mlx @ git+https://github.com/mizorewww/laya-mlx.git@0a859518634112655cb97c745dbf04f5191aaf13"]
mlx-metal = ["mlx==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'", "laya-mlx @ git+https://github.com/mizorewww/laya-mlx.git@0a859518634112655cb97c745dbf04f5191aaf13"]

[tool.uv]
conflicts = [[{extra = "mlx-cpu"}, {extra = "mlx-cuda"}, {extra = "mlx-metal"}]]

[tool.hatch.build.targets.wheel]
packages = ["src/model_router"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/scripts", "/docs", "/.github", "/examples", "/config/*.example.json",
    "/artifacts/README.md", "/artifacts/cloud-mlx-cpu.json", "/artifacts/cloud-mlx-gpu.json",
    "/artifacts/deployment.json", "/artifacts/gateway-smoke.json",
    "/artifacts/instruction-sensitivity.json", "/artifacts/live-100-openrouter.json",
    "/artifacts/local-mlx-cpu.json", "/artifacts/local-setup-smoke.json",
    "/artifacts/local-torch-cpu.json", "/artifacts/openrouter-adapter-smoke.json",
    "/artifacts/summary.json",
    "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/CHANGELOG.md",
    "/CONTRIBUTING.md", "/SECURITY.md", "/CODE_OF_CONDUCT.md",
    "/pyproject.toml", "/uv.lock", "/.env.example", "/.dockerignore", "/.gitignore",
    "/.gitleaks.toml", "/Dockerfile*", "/compose*.yaml", "/cloudbuild*.yaml",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
