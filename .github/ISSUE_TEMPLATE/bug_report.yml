name: Bug report
description: Report a reproducible problem with setup, routing or streaming.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: "Use synthetic prompts and omit API keys or identity tokens. For sensitive reports, see SECURITY.md."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Commands or a small Python example, with credentials removed.
      render: text
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python version, commit or branch"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Include sanitized error messages or routing reasons.
      render: text
