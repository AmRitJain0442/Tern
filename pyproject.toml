[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tern-router"
version = "0.1.0"
description = "GPU-assisted LLM routing with conservative policies and OpenRouter dispatch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[project.scripts]
tern = "model_router.cli:main"
model-router = "model_router.cli:main"

[project.urls]
Repository = "https://github.com/AmRitJain0442/tern"
Documentation = "https://github.com/AmRitJain0442/tern/blob/main/docs/quickstart.md"
Issues = "https://github.com/AmRitJain0442/tern/issues"

[project.optional-dependencies]
adapter = ["google-auth[requests]>=2.38,<3"]
cli = ["google-auth[requests]>=2.38,<3", "rich>=13.9,<15", "python-dotenv>=1,<2"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
mlx-cpu = ["mlx[cpu]==0.32.2; sys_platform == 'linux'", "laya-mlx @ git+https://github.com/mizorewww/laya-mlx.git@0a859518634112655cb97c745dbf04f5191aaf13"]
mlx-cuda = ["mlx[cuda12]==0.32.2; sys_platform == 'linux'", "nvidia-cuda-runtime-cu12==12.9.79; sys_platform == 'linux'", "laya-mlx @ git+https://github.com/mizorewww/laya-mlx.git@0a859518634112655cb97c745dbf04f5191aaf13"]

[tool.uv]
conflicts = [[{extra = "mlx-cpu"}, {extra = "mlx-cuda"}]]

[tool.hatch.build.targets.wheel]
packages = ["src/model_router"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
